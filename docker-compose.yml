version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: devroast_db
    environment:
      POSTGRES_USER: devroast_user
      POSTGRES_PASSWORD: devroast_password
      POSTGRES_DB: devroast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

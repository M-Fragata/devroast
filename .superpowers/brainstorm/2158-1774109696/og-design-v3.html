<h2>OG Image - Adjusted Layout</h2>
<p class="subtitle">Logo left-aligned, verdict centered</p>

<div class="mockup">
  <div class="mockup-header">OG Image Preview (1200x630)</div>
  <div class="mockup-body">
    <svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#0C0C0C">
      <!-- Background -->
      <rect width="1200" height="630" fill="#0C0C0C"/>
      
      <!-- Logo Row: left aligned -->
      <g transform="translate(80, 160)">
        <text x="0" y="10" fill="#22C55E" font-family="monospace" font-size="24" font-weight="700">&gt;</text>
        <text x="30" y="10" fill="#F2F3F0" font-family="monospace" font-size="20" font-weight="500">devroast</text>
      </g>
      
      <!-- Content - centered -->
      <g transform="translate(600, 350)">
        
        <!-- Score Row: 3.5 /10 -->
        <g transform="translate(0, -120)">
          <text x="0" y="50" fill="#F59E0B" font-family="monospace" font-size="160" font-weight="900" text-anchor="middle">3.5</text>
          <text x="90" y="50" fill="#4B5563" font-family="monospace" font-size="56" font-weight="normal">/10</text>
        </g>
        
        <!-- Verdict Row: centered with dot -->
        <g transform="translate(0, -20)">
          <circle cx="-105" cy="2" r="6" fill="#EF4444"/>
          <text x="-88" y="10" fill="#EF4444" font-family="monospace" font-size="20">needs_serious_help</text>
        </g>
        
        <!-- Lang Info -->
        <g transform="translate(0, 30)">
          <text x="0" y="0" fill="#4B5563" font-family="monospace" font-size="16" text-anchor="middle">lang: javascript · 7 lines</text>
        </g>
        
        <!-- Roast Quote -->
        <g transform="translate(0, 90)">
          <text x="0" y="0" fill="#F2F3F0" font-family="monospace" font-size="22" text-anchor="middle">"this code was written during a power outage..."</text>
        </g>
        
      </g>
      
      <!-- Border frame -->
      <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1F1F1F" stroke-width="1"/>
    </svg>
  </div>
</div>
